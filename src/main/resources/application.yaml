spring:
  application:
    name: ultistats
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ultistats}
    username: ${DATABASE_USERNAME:ultistats}
    password: ${DATABASE_PASSWORD:ultistats}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:uploads}

# No dsn default: an unset/empty SENTRY_DSN leaves the SDK disabled.
sentry:
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  server-name: ""
  enable-auto-session-tracking: false
  send-client-reports: false
  logs:
    enabled: true
  tags:
    service: ${SENTRY_SERVICE:ultistats-backend}
  logging:
    loggers: com.github.mihanizzm.ultistats
    minimum-event-level: ERROR
    minimum-breadcrumb-level: INFO
    minimum-level: WARN
  ignored-exceptions-for-type:
    - org.springframework.security.access.AccessDeniedException
    - org.springframework.security.core.AuthenticationException
    - org.springframework.web.context.request.async.AsyncRequestNotUsableException
    - org.apache.catalina.connector.ClientAbortException
