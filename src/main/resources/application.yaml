spring:
  application:
    name: ultistats
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ultistats}
    username: ${DATABASE_USERNAME:ultistats}
    password: ${DATABASE_PASSWORD:ultistats}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:uploads}
