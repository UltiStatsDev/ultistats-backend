name: CI

on:
  pull_request:
    branches:
      - master
      - release
      - candidate/stable-v0.1.0
  push:
    branches:
      - release
      - candidate/stable-v0.1.0
      - hotfix/**
      - agent/hotfix/**
      # Bootstrap exact-head checks before the first candidate-target PR.
      - agent/feature/160-stable-promotion
    tags: ['v*']

permissions:
  contents: read

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          pattern='^((agent/)?(issue|feature|bugfix|chore|hotfix)/[0-9]+-|agent/(issue|feature|bugfix|chore|hotfix)-[0-9]+-)[a-z0-9]+(-[a-z0-9]+)*$'
          version='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$REF_TYPE" == tag && "$BRANCH_NAME" =~ $version ]]; then
            echo "Stable version tag is valid: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == release || "$BRANCH_NAME" == candidate/stable-v0.1.0 || "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Branch name is valid: $BRANCH_NAME"
          else
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected format: [agent/]<type>/<issue-number>-<description>"
            echo "Examples: issue/7-add-ci, agent/issue/7-add-ci, feature/12-player-statistics"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate deployment safety
        run: |
          bash deploy/tests/validate-compose.sh
          bash deploy/tests/deploy_test.sh
          bash deploy/tests/validate-workflow.sh

      - name: Build and test
        run: ./gradlew build

  obs-browser-logic:
    name: OBS browser logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OBS feed, reconciliation and colors
        run: node --test src/test/js/*.test.mjs

  stable-promotion:
    name: Stable promotion guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test immutable source refs and publication isolation
        run: find deploy/stable -name '*.test.mjs' -type f -print0 | sort -z | xargs -0 node --test
