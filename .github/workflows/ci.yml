name: CI

on:
  pull_request:
    branches:
      - master
      - release
      - candidate/stable-v0.1.0
      - candidate/private-stand-v1
  push:
    branches:
      - release
      - candidate/stable-v0.1.0
      - candidate/private-stand-v1
      - hotfix/**
      - agent/hotfix/**
      # Bootstrap exact-head checks before the first candidate-target PR.
      - agent/feature/160-stable-promotion
      - agent/chore/168-stand-ci
    tags: ['v*']

permissions:
  contents: read

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          pattern='^((agent/)?(issue|feature|bugfix|chore|hotfix)/[0-9]+-|agent/(issue|feature|bugfix|chore|hotfix)-[0-9]+-)[a-z0-9]+(-[a-z0-9]+)*$'
          version='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$REF_TYPE" == tag && "$BRANCH_NAME" =~ $version ]]; then
            echo "Stable version tag is valid: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == release || "$BRANCH_NAME" == candidate/stable-v0.1.0 || "$BRANCH_NAME" == candidate/private-stand-v1 || "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Branch name is valid: $BRANCH_NAME"
          else
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected format: [agent/]<type>/<issue-number>-<description>"
            echo "Examples: issue/7-add-ci, agent/issue/7-add-ci, feature/12-player-statistics"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate deployment safety
        run: |
          bash deploy/tests/validate-compose.sh
          bash deploy/tests/deploy_test.sh
          bash deploy/tests/validate-workflow.sh

      - name: Build and test
        run: ./gradlew build

  obs-browser-logic:
    name: OBS browser logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OBS feed, reconciliation and colors
        run: node --test src/test/js/*.test.mjs

  stable-promotion:
    name: Stable promotion guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test immutable source refs and publication isolation
        run: find deploy/stable -name '*.test.mjs' -type f -print0 | sort -z | xargs -0 node --test

  private-stand-node:
    name: Private stand Node boundaries
    if: github.base_ref == 'candidate/private-stand-v1' || github.ref == 'refs/heads/candidate/private-stand-v1' || github.ref == 'refs/heads/agent/chore/168-stand-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private stand CI contract
        run: node --test deploy/ci/private-stand.test.mjs
      - name: Test available private stand source
        run: |
          if [[ -d deploy/stand ]]; then
            test -n "$(find deploy/stand -name '*.test.mjs' -type f -print -quit)"
            find deploy/stand -name '*.test.mjs' -type f -print0 | sort -z | xargs -0 node --test
          else
            echo '::notice::CI bootstrap has no private stand implementation; no SQL proof is claimed.'
          fi

  private-stand-roles-pg:
    name: Private stand roles real PostgreSQL
    if: github.base_ref == 'candidate/private-stand-v1' || github.ref == 'refs/heads/candidate/private-stand-v1' || github.ref == 'refs/heads/agent/chore/168-stand-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require real PostgreSQL runner when role module is present
        id: roles
        run: |
          if [[ -f deploy/stand/sql-roles.mjs ]]; then
            test -f deploy/stand/tests/run-sql-roles.sh
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Role module absent in CI bootstrap; PostgreSQL integration is not available.'
          fi
      - name: Test SQL role boundaries against real PostgreSQL 16
        if: steps.roles.outputs.present == 'true'
        run: |
          docker info >/dev/null
          command -v openssl flock
          flock -w 120 -x /tmp/ultistats-web-heavy-check.lock bash deploy/stand/tests/run-sql-roles.sh

  private-stand-fence-pg:
    name: Private stand fence real PostgreSQL
    if: github.base_ref == 'candidate/private-stand-v1' || github.ref == 'refs/heads/candidate/private-stand-v1' || github.ref == 'refs/heads/agent/chore/168-stand-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require PostgreSQL proxy suite when maintenance module is present
        id: fence
        run: |
          if [[ -f deploy/stand/sql-maintenance.mjs ]]; then
            test -f deploy/stand/tests/sql-proxy.integration.test.mjs
            test -f deploy/stand/sql-proxy/Dockerfile
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Maintenance module absent in CI bootstrap; PostgreSQL proxy integration is not available.'
          fi
      - name: Build owned test SQL proxy
        if: steps.fence.outputs.present == 'true'
        run: |
          docker info >/dev/null
          flock -w 120 -x /tmp/ultistats-web-heavy-check.lock \
            flock -w 120 -x /tmp/ultistats-browser-network.lock \
            docker build -t ultistats-stand170-proxy:test deploy/stand/sql-proxy
      - name: Test actual PostgreSQL fencing and recovery
        if: steps.fence.outputs.present == 'true'
        env:
          STAND_SQL_INTEGRATION: '1'
        run: |
          flock -w 120 -x /tmp/ultistats-web-heavy-check.lock \
            flock -w 120 -x /tmp/ultistats-browser-network.lock \
            node --test deploy/stand/tests/sql-proxy.integration.test.mjs

  private-stand-bootstrap-pg:
    name: Private stand bootstrap actual247 PostgreSQL
    if: github.base_ref == 'candidate/private-stand-v1' || github.ref == 'refs/heads/candidate/private-stand-v1' || github.ref == 'refs/heads/agent/chore/168-stand-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Require actual247 bootstrap runner when module is present
        id: bootstrap
        run: |
          if [[ -f deploy/stand/sql-bootstrap.mjs ]]; then
            test -f deploy/stand/tests/run-sql-bootstrap.sh
            git cat-file -e 24704e11143a0bf919559a41324603f936ae03cf^{commit}
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Bootstrap module absent; no NEW-cluster or actual247 SQL bootstrap proof is claimed.'
          fi
      - name: Test NEW PostgreSQL bootstrap and actual247 owner/service configuration
        if: steps.bootstrap.outputs.present == 'true'
        run: bash deploy/stand/tests/run-sql-bootstrap.sh
